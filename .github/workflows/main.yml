name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev \
            libssl-dev llvm libffi-dev libbz2-dev build-essential

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33
          pip install --upgrade buildozer

      - name: Bypass P4A Remote Fetch and Prepare Spec
        run: |
          # تعديل ملف buildozer.spec مباشرة لإيقاف البحث عن مستودعات خارجية معقدة
          sed -i 's/#android.presplash_color.*/android.presplash_color = #242424/g' buildozer.spec
          
          # إنشاء مجلدات التراخيص بصيغتها الصحيحة المطلوبة
          mkdir -p ~/.android
          echo "y" > ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bac1632f8a780564a75267b148f7389c130d" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a43b682d23f5bbf91d956f1ffd515f3fd" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
